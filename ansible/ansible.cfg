[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = .collections
stdout_callback = ansible.builtin.default
result_format = yaml
interpreter_python = auto_silent
host_key_checking = True

[ssh_connection]
pipelining = True
# Ansible's default ssh_args, plus accept-new: the first connection from a new
# computer (an empty known_hosts) records each Pi's host key instead of stopping
# at a yes/no prompt per Pi. A key that CHANGED is still refused.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
