---
# Apply everything. Roles are added per step of the roadmap in README.md.
# Configure one Pi only with: make apply LIMIT=octopi
#
# Every play waits up to 10 minutes for the apt lock: a freshly booted Pi runs
# its daily apt/unattended-upgrades jobs straight away and holds the lock.
- name: All Raspberry Pis
  hosts: pis
  become: true
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 600
  pre_tasks:
    - name: Check this is a 64-bit Raspberry Pi OS (Debian) host
      ansible.builtin.assert:
        that:
          - ansible_facts['architecture'] == 'aarch64'
          - ansible_facts['os_family'] == 'Debian'
        fail_msg: >-
          Expected Raspberry Pi OS Lite 64-bit, got
          {{ ansible_facts['distribution'] }} {{ ansible_facts['architecture'] }}.

    # A dry run of a Pi's first apply fails part-way (services that its packages
    # would install don't exist yet), so stop with a clear message instead. The
    # Pi drops out of the rest of the run; other Pis are checked as usual.
    - name: Look for a previous make apply
      ansible.builtin.stat:
        path: /var/lib/pi-setup-applied
      register: pis_applied
      when: ansible_check_mode

    - name: Refuse a dry run of a Pi that has never been configured
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} has never been configured by make apply, so a
          dry run has nothing to compare against. Run: make apply LIMIT={{ inventory_hostname }}
      when: ansible_check_mode and not pis_applied.stat.exists
  roles:
    - base
    - network
    - tailscale

# usbip or VirtualHere, per host (usb_server in inventory/group_vars/usbip.yml).
# Each role turns the other off, so they never share the dongles.
- name: USB-over-IP server
  hosts: usbip
  become: true
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 600
  pre_tasks:
    - name: Check usb_server
      ansible.builtin.assert:
        that: usb_server in ['usbip', 'virtualhere']
        fail_msg: "usb_server must be usbip or virtualhere, not {{ usb_server }}"
  roles:
    - role: usbip
      when: usb_server == 'usbip'
    - role: virtualhere
      when: usb_server == 'virtualhere'

- name: 3D printer server
  hosts: printers
  become: true
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 600
  roles:
    - podman
    - octoprint

- name: Shell and dotfiles for the login user
  hosts: pis
  become: true
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 600
  roles:
    - dotfiles
