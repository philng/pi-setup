---
# Official image: https://github.com/OctoPrint/octoprint-docker
# Pinned to the 1.11 series: podman-auto-update still pulls its patch
# releases (1.11.x) every day, and rolls back if one fails to start, but a
# new minor or major version (2.0) only comes when you change this.
# The official image is built on Python 3.10, so OctoPrint shows a "Python
# 3.10 is past its end of life" notice; OctoPrint 2.0.x still supports it.
octoprint_image: docker.io/octoprint/octoprint:1.11

# Host port for the web UI. The container listens on 80 (haproxy in front of
# OctoPrint and the webcam stream). Below 1024 the role lets rootless
# containers bind it, so http://octopi works without a port.
octoprint_port: 80

# OctoPrint config, plugins, uploads and timelapses. Mounted at /octoprint.
octoprint_data_dir: "{{ podman_user_home }}/octoprint"

# The printer and webcam are found on the Pi by themselves, at make apply and
# whenever one is plugged in later, by /usr/local/sbin/octoprint-devices.
# Nothing to set for one Prusa and one USB webcam: plug them in whenever.
#
# Printer: the /dev/serial/by-id/ entry whose name matches this regex
# (case-insensitive), or else the only entry there. Neither (nothing plugged
# in, or several unknown devices): /dev/ttyACM0 and /dev/ttyUSB0 are passed
# through as they are, if they appear. Inside the container the printer is
# always /dev/ttyACM0, so OctoPrint's auto-detect finds it.
octoprint_printer_match: prusa
# Set a path to skip detection, e.g. one from ls /dev/serial/by-id/.
octoprint_printer_device: ""

# Webcam: the /dev/v4l/by-id/*-video-index0 entry whose name matches this
# regex, or else the only one. None: mjpg-streamer stays off until a camera
# is plugged in, then OctoPrint restarts with it (no make apply needed).
octoprint_webcam_match: "c920|webcam|camera"
# Set a path to skip detection, or "off" to never use a webcam.
octoprint_webcam_device: ""
# Options for mjpg-streamer's input_uvc.so. A Logitech C920 sends MJPEG, so
# "-n -r 1280x720 -f 15" is a good choice for it on a Pi 4.
octoprint_mjpg_streamer_input: "-n -r 640x480"
# Unless the webcam is "off", the role points OctoPrint's Classic Webcam at
# these, which plugins such as OctoEverywhere Gadget need.
octoprint_webcam_stream_url: /webcam/?action=stream
octoprint_webcam_snapshot_url: http://localhost:8080/?action=snapshot

# UVC controls to set on the webcam whenever it appears (and on make apply),
# with v4l2-ctl, in this order. List them with
#   v4l2-ctl -d /dev/v4l/by-id/<camera> -l
# For a C920, fixed focus keeps timelapses sharp:
#   octoprint_webcam_controls:
#     focus_automatic_continuous: 0
#     focus_absolute: 0   # 0 = far; raise it until the bed is sharp
octoprint_webcam_controls: {}

# Plugins to make sure are installed, by pip name and install URL (the
# "archive" URL on the plugin's page at plugins.octoprint.org). They go into
# the data dir (/octoprint/plugins), so backups include them. The role only
# installs missing ones: update them from OctoPrint's Software Update as usual.
#   octoprint_plugins:
#     - name: OctoEverywhere
#       url: https://github.com/QuinnDamerell/OctoPrint-OctoEverywhere/archive/master.zip
octoprint_plugins: []

# OctoPrint's admin login. OctoPrint has no user until someone runs its setup
# wizard, and until then anyone on the network can open the wizard and make
# themselves admin. So if no active admin exists, the role creates this one
# with a random password, saved on your computer in the file below
# (secrets/ is git-ignored). An admin restored from a backup, or one you made
# in the wizard, counts too, and then the role leaves users alone.
# To pick the password yourself, set octoprint_admin_password (vault it).
octoprint_admin_user: admin
octoprint_admin_password_file: "{{ playbook_dir }}/../secrets/octoprint-admin-{{ inventory_hostname }}"
octoprint_admin_password: >-
  {{ lookup('ansible.builtin.password', octoprint_admin_password_file,
            chars=['ascii_letters', 'digits'], length=24) }}

# A flash profile for the Firmware Updater plugin (OctoPrint-FirmwareUpdater),
# written once, when the plugin has no configured profile yet. After that,
# change it in Settings > Firmware Updater; the role won't overwrite it.
# Keys are the plugin's profile settings. Empty: leave the plugin alone.
#   octoprint_firmwareupdater_profile:
#     _name: Prusa MK3S+
#     flash_method: avrdude
#     avrdude_path: /usr/bin/avrdude
#     avrdude_avrmcu: m2560
#     avrdude_programmer: wiring
#     avrdude_baudrate: 115200
octoprint_firmwareupdater_profile: {}

# Restore OctoPrint's data from this tarball (made by `make octoprint-backup`)
# when the Pi has no OctoPrint config yet, i.e. after a rebuild.
octoprint_restore_from: "{{ playbook_dir }}/../backups/octoprint/latest.tar.gz"

# Backups skip uploaded G-code, timelapses and logs unless this is true.
octoprint_backup_include_files: false
