---
- name: Install v4l2-ctl for webcam controls
  ansible.builtin.apt:
    name: v4l-utils
    state: present
    cache_valid_time: 3600
  when: octoprint_webcam_controls | length > 0

- name: Let rootless containers bind the web UI port
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "{{ octoprint_port }}"
    sysctl_file: /etc/sysctl.d/60-octoprint.conf
    sysctl_set: true
  when: octoprint_port | int < 1024

# Rootless containers lose supplementary groups unless the unit uses
# --group-add keep-groups, which then gives OctoPrint the user's dialout
# (serial) and video (webcam) access.
- name: Give the container user serial and webcam access
  ansible.builtin.user:
    name: "{{ podman_user }}"
    groups: [dialout, video]
    append: true
  notify:
    - Restart podman user manager
    - Restart octoprint

- name: Create the OctoPrint data directory
  ansible.builtin.file:
    path: "{{ octoprint_data_dir }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0750"

- name: Check for an existing OctoPrint config
  ansible.builtin.stat:
    path: "{{ octoprint_data_dir }}/octoprint/config.yaml"
  register: octoprint_config

- name: Look for a backup to restore
  ansible.builtin.stat:
    path: "{{ octoprint_restore_from }}"
  delegate_to: localhost
  become: false
  register: octoprint_backup
  when: not octoprint_config.stat.exists

# The container runs as root inside its user namespace, which maps to the
# rootless user, so everything in the data dir belongs to that user.
- name: Restore OctoPrint data from backup
  ansible.builtin.unarchive:
    src: "{{ octoprint_restore_from }}"
    dest: "{{ octoprint_data_dir }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
  when:
    - not octoprint_config.stat.exists
    - octoprint_backup.stat.exists | default(false)
  notify: Restart octoprint

- name: Pull the OctoPrint image
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_env }}"
  containers.podman.podman_image:
    name: "{{ octoprint_image }}"

- name: Install the OctoPrint Quadlet unit
  ansible.builtin.template:
    src: octoprint.container.j2
    dest: "{{ podman_user_home }}/.config/containers/systemd/octoprint.container"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  notify:
    - Podman user daemon-reload
    - Restart octoprint

# The printer and webcam go into a Quadlet drop-in, written by
# octoprint-devices: now, and again whenever a USB serial port or camera
# appears (udev starts octoprint-replug@tty or @video). Quadlet only passes a
# device that exists when the unit is generated, and a running container
# never sees devices plugged in later, so the script also regenerates the
# unit and restarts OctoPrint then.
- name: Install the device detection script
  ansible.builtin.copy:
    src: octoprint-devices
    dest: /usr/local/sbin/octoprint-devices
    owner: root
    group: root
    mode: "0755"

- name: Configure device detection
  ansible.builtin.template:
    src: octoprint-devices.j2
    dest: /etc/default/octoprint-devices
    owner: root
    group: root
    mode: "0644"

# Before this role found devices by itself it had one non-template unit.
- name: Remove the old replug service
  ansible.builtin.file:
    path: /etc/systemd/system/octoprint-replug.service
    state: absent
  notify: Reload systemd

- name: Install the replug service
  ansible.builtin.template:
    src: octoprint-replug@.service.j2
    dest: /etc/systemd/system/octoprint-replug@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install the udev rule that starts it
  ansible.builtin.template:
    src: 70-octoprint.rules.j2
    dest: /etc/udev/rules.d/70-octoprint.rules
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev rules

# Also sets octoprint_webcam_controls on the camera, if there is one.
- name: Find the printer and webcam
  ansible.builtin.command: /usr/local/sbin/octoprint-devices apply
  register: octoprint_devices
  changed_when: "'changed=yes' in octoprint_devices.stdout_lines"
  notify:
    - Podman user daemon-reload
    - Restart octoprint

- name: Say what was found
  vars:
    octoprint_found: >-
      {{ dict(octoprint_devices.stdout_lines | default([])
              | select('match', '^(printer|webcam)=')
              | map('regex_findall', '^([a-z]+)=(.*)$') | map('first')) }}
  ansible.builtin.debug:
    msg:
      - >-
        Printer: {{ octoprint_found.printer | default('', true)
        or 'nothing in /dev/serial/by-id yet. /dev/ttyACM0 or /dev/ttyUSB0 is passed
        through when it appears, so plug the printer in (or power it on) any time.' }}
      - >-
        Webcam: {{ 'off (octoprint_webcam_device)' if octoprint_webcam_device == 'off'
        else octoprint_found.webcam | default('', true)
        or 'none found. Plug one in any time: OctoPrint restarts with it, no make apply needed.' }}
  when: octoprint_devices is not skipped

- name: Apply group, unit and udev changes before starting
  ansible.builtin.meta: flush_handlers

- name: Start OctoPrint
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_env }}"
  ansible.builtin.systemd_service:
    name: octoprint.service
    scope: user
    state: started

# Everything below talks to the running container. Wait until OctoPrint has
# started and written its config, so it doesn't overwrite what we set.
# A Pi's very first start (config, plugin scan, on an SD card) can take
# several minutes, and haproxy answers 503 until OctoPrint is up. So wait up
# to 15 minutes, and if that's not enough, show why instead of just timing out.
- name: Wait for OctoPrint to finish starting
  check_mode: false
  block:
    - name: Wait for OctoPrint's web UI
      ansible.builtin.uri:
        url: http://localhost:{{ octoprint_port }}/
        status_code: [200, 302]
        timeout: 10
      register: octoprint_up
      until: octoprint_up.status in [200, 302]
      retries: "{{ octoprint_start_retries }}"
      delay: 2
  rescue:
    - name: Collect the service state and container log  # noqa: command-instead-of-module
      become: true
      become_user: "{{ podman_user }}"
      environment: "{{ podman_user_env }}"
      ansible.builtin.shell: |
        systemctl --user status octoprint.service --no-pager -l --lines 0
        echo; podman ps -a
        echo; podman logs --tail 40 octoprint
      args:
        chdir: /
      register: octoprint_start_debug
      changed_when: false
      failed_when: false

    - name: Fail with what OctoPrint was doing
      ansible.builtin.fail:
        msg:
          - >-
            OctoPrint didn't answer on http://localhost:{{ octoprint_port }}/ within
            {{ (octoprint_start_retries | int * 2 / 60) | round | int }} minutes.
            Last answer: {{ octoprint_up.status | default('none') }}
            {{ octoprint_up.msg | default('') }}.
            If the log below shows it still starting, run make apply again.
          - "{{ octoprint_start_debug.stdout_lines | default([]) }}"

# Until OctoPrint has an admin, anyone who can reach it can run the setup
# wizard and become admin. Close that before anything else.
- name: Look for OctoPrint's user list
  ansible.builtin.stat:
    path: "{{ octoprint_data_dir }}/octoprint/users.yaml"
  register: octoprint_users_file

- name: Read OctoPrint's user list
  ansible.builtin.slurp:
    path: "{{ octoprint_data_dir }}/octoprint/users.yaml"
  register: octoprint_users_raw
  when: octoprint_users_file.stat.exists

- name: Find active OctoPrint admins
  ansible.builtin.set_fact:
    octoprint_admins: >-
      {{ (octoprint_users_raw.content | b64decode | from_yaml | default({}, true))
         | dict2items
         | rejectattr('key', 'match', '^_')
         | selectattr('value.active', 'defined') | selectattr('value.active')
         | selectattr('value.groups', 'defined')
         | selectattr('value.groups', 'contains', 'admins')
         | map(attribute='key') | list
         if octoprint_users_file.stat.exists else [] }}

# The CLI reads the password twice from stdin, so it never shows up in `ps`.
# The running server only reads users.yaml at startup, so restart it.
- name: Create the OctoPrint admin
  when: octoprint_admins | length == 0
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_env }}"
  block:
    - name: Add the admin user
      ansible.builtin.command:
        cmd: >-
          {{ octoprint_exec_stdin }} octoprint --basedir /octoprint/octoprint
          user add --admin {{ octoprint_admin_user | quote }}
        stdin: "{{ octoprint_admin_password }}\n{{ octoprint_admin_password }}"
      changed_when: true
      no_log: true

    - name: Restart OctoPrint so it knows the new admin
      ansible.builtin.systemd_service:
        name: octoprint.service
        scope: user
        state: restarted

    - name: Wait for OctoPrint to come back
      ansible.builtin.uri:
        url: http://localhost:{{ octoprint_port }}/
        status_code: [200, 302]
        timeout: 10
      register: octoprint_up_again
      until: octoprint_up_again.status in [200, 302]
      retries: "{{ octoprint_start_retries }}"
      delay: 2

    - name: Say where the admin password is
      ansible.builtin.debug:
        msg: >-
          Created OctoPrint user '{{ octoprint_admin_user }}'.
          {{ 'Its password is in ' ~ (octoprint_admin_password_file | realpath) ~ ' on this computer.'
             if octoprint_admin_password_file is file
             else 'Its password is the one set in octoprint_admin_password.' }}

# Autologin would hand every visitor from the local network a logged-in
# session, which makes the login pointless.
- name: Read OctoPrint's autologin setting
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_env }}"
  ansible.builtin.command: "{{ octoprint_cli }} config get --raw accessControl.autologinLocal"
  register: octoprint_autologin
  changed_when: false
  check_mode: false

- name: Turn off OctoPrint's autologin
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_env }}"
  ansible.builtin.command: "{{ octoprint_cli }} config set --bool accessControl.autologinLocal false"
  when: octoprint_autologin.stdout != 'False'
  changed_when: true
  notify: Restart octoprint

# The image sets PIP_USER and PYTHONUSERBASE=/octoprint/plugins, so pip in
# the container installs into the data dir, like OctoPrint's Plugin Manager.
- name: Check which OctoPrint plugins are installed
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_env }}"
  ansible.builtin.command: "{{ octoprint_exec }} pip show --quiet {{ item.name }}"
  loop: "{{ octoprint_plugins }}"
  loop_control:
    label: "{{ item.name }}"
  register: octoprint_plugin_check
  changed_when: false
  failed_when: octoprint_plugin_check.rc not in [0, 1]
  check_mode: false

- name: Install missing OctoPrint plugins
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_env }}"
  ansible.builtin.command: "{{ octoprint_exec }} pip install --no-cache-dir {{ item.item.url | quote }}"
  loop: "{{ octoprint_plugin_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc != 0
  changed_when: true
  notify: Restart octoprint

# Set even before a camera is plugged in, so one plugged in later just works.
- name: Read OctoPrint's webcam settings
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_env }}"
  ansible.builtin.command: "{{ octoprint_cli }} config get --raw {{ item.key }}"
  loop: "{{ octoprint_webcam_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: octoprint_webcam_current
  changed_when: false
  check_mode: false
  when: octoprint_webcam_device != 'off'

- name: Point OctoPrint at the webcam stream and snapshot
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_env }}"
  ansible.builtin.command: "{{ octoprint_cli }} config set {{ item.item.key }} {{ item.item.value | quote }}"
  loop: "{{ octoprint_webcam_current.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - item.stdout is defined
    - item.stdout != item.item.value
  changed_when: true
  notify: Restart octoprint

# The Firmware Updater flashes the printer from inside the container, through
# the same serial port OctoPrint uses. The official image ships avrdude.
- name: Check the flash tool is in the OctoPrint image
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_env }}"
  ansible.builtin.command: "{{ octoprint_exec }} test -x {{ octoprint_firmwareupdater_profile.avrdude_path | quote }}"
  register: octoprint_avrdude
  changed_when: false
  failed_when: false
  check_mode: false
  when: octoprint_firmwareupdater_profile.flash_method | default('') == 'avrdude'

- name: Fail if the image has no avrdude
  ansible.builtin.fail:
    msg: >-
      {{ octoprint_firmwareupdater_profile.avrdude_path }} isn't in {{ octoprint_image }},
      so the Firmware Updater can't flash the printer. Use the official
      docker.io/octoprint/octoprint image, which includes avrdude, or fix avrdude_path.
  when:
    - octoprint_avrdude is not skipped
    - octoprint_avrdude.rc != 0

- name: Read the Firmware Updater's flash profiles
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_env }}"
  ansible.builtin.command: "{{ octoprint_cli }} config get --json plugins.firmwareupdater.profiles"
  register: octoprint_fwu_profiles
  changed_when: false
  check_mode: false
  when: octoprint_firmwareupdater_profile | length > 0

# Only when no profile has a flash method yet (fresh install, or the empty
# "Default" profile the plugin makes for itself), so edits in the UI stay.
- name: Write the Firmware Updater's flash profile
  become: true
  become_user: "{{ podman_user }}"
  environment: "{{ podman_user_env }}"
  ansible.builtin.command: >-
    {{ octoprint_cli }} config set {{ item.type }}
    plugins.firmwareupdater.{{ item.key }} {{ item.value | quote }}
  loop:
    - type: --json
      key: profiles
      value: "{{ [{'_id': 0} | combine(octoprint_firmwareupdater_profile)] | to_json }}"
    - type: --int
      key: _selected_profile
      value: "0"
    - type: --int
      key: _config_version
      value: "{{ octoprint_firmwareupdater_settings_version }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - octoprint_firmwareupdater_profile | length > 0
    - >-
      [octoprint_fwu_profiles.stdout | from_json | default([], true)] | flatten
      | selectattr('flash_method', 'defined') | rejectattr('flash_method', 'none')
      | list | length == 0
  changed_when: true
  notify: Restart octoprint
