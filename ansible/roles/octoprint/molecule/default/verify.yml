---
- name: Verify
  hosts: all
  become: true
  vars:
    podman_user: pods
  tasks:
    - name: Look up the container user
      ansible.builtin.getent:
        database: passwd
        key: "{{ podman_user }}"

    - name: Set the user's environment
      ansible.builtin.set_fact:
        octoprint_verify_env:
          XDG_RUNTIME_DIR: /run/user/{{ ansible_facts.getent_passwd[podman_user][1] }}

    - name: Check the user is in dialout and video
      ansible.builtin.command: id -nG {{ podman_user }}
      register: octoprint_verify_groups
      changed_when: false
      failed_when: >-
        'dialout' not in octoprint_verify_groups.stdout.split()
        or 'video' not in octoprint_verify_groups.stdout.split()

    - name: Check octoprint.service is active  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl --user -M {{ podman_user }}@ is-active octoprint.service
      register: octoprint_verify_active
      changed_when: false
      failed_when: octoprint_verify_active.stdout != 'active'

    - name: Wait for the web UI on port 80
      ansible.builtin.uri:
        url: http://localhost/
        status_code: [200, 302]
      register: octoprint_verify_http
      until: octoprint_verify_http.status in [200, 302]
      retries: 60
      delay: 5

    - name: Check the printer port was passed through and is writable
      become: true
      become_user: "{{ podman_user }}"
      environment: "{{ octoprint_verify_env }}"
      ansible.builtin.command: podman exec octoprint sh -c 'test -c /dev/ttyACM0 && echo M115 > /dev/ttyACM0'
      changed_when: false

    - name: Check the replug service and udev rule are installed
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/octoprint-replug.service
        - /etc/udev/rules.d/70-octoprint.rules
      register: octoprint_verify_files
      failed_when: not octoprint_verify_files.stat.exists

    - name: Run the replug service like udev would
      ansible.builtin.systemd_service:
        name: octoprint-replug.service
        state: started

    - name: Check OctoPrint came back after the replug restart
      ansible.builtin.uri:
        url: http://localhost/
        status_code: [200, 302]
      register: octoprint_verify_http_again
      until: octoprint_verify_http_again.status in [200, 302]
      retries: 60
      delay: 5
