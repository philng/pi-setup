---
- name: Verify
  hosts: all
  become: true
  vars:
    podman_user: pods
    octoprint_verify_printer: usb-Prusa_Research__prusa3d.com__Original_Prusa_i3_MK3_CZPX1234X004XK12345-if00
    octoprint_verify_webcam: usb-046d_HD_Pro_Webcam_C920_MOLECULE-video-index0
  tasks:
    - name: Look up the container user
      ansible.builtin.getent:
        database: passwd
        key: "{{ podman_user }}"

    - name: Set the user's environment
      ansible.builtin.set_fact:
        octoprint_verify_env:
          XDG_RUNTIME_DIR: /run/user/{{ ansible_facts.getent_passwd[podman_user][1] }}

    - name: Check the user is in dialout and video
      ansible.builtin.command: id -nG {{ podman_user }}
      register: octoprint_verify_groups
      changed_when: false
      failed_when: >-
        'dialout' not in octoprint_verify_groups.stdout.split()
        or 'video' not in octoprint_verify_groups.stdout.split()

    - name: Check octoprint.service is active  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl --user -M {{ podman_user }}@ is-active octoprint.service
      register: octoprint_verify_active
      changed_when: false
      failed_when: octoprint_verify_active.stdout != 'active'

    - name: Wait for the web UI on port 80
      ansible.builtin.uri:
        url: http://localhost/
        status_code: [200, 302]
      register: octoprint_verify_http
      until: octoprint_verify_http.status in [200, 302]
      retries: 300
      delay: 1

    # Converge ran with nothing plugged in.
    - name: Read the device drop-in written with no devices
      ansible.builtin.slurp:
        path: /home/{{ podman_user }}/.config/containers/systemd/octoprint.container.d/50-devices.conf
      register: octoprint_verify_dropin_empty

    - name: Check it passes the generic serial ports and keeps the webcam off
      vars:
        dropin: "{{ octoprint_verify_dropin_empty.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'AddDevice=-/dev/ttyACM0\n' in dropin"
          - "'AddDevice=-/dev/ttyUSB0\n' in dropin"
          - "'Environment=ENABLE_MJPG_STREAMER=false' in dropin"
          - "'by-id' not in dropin"

    - name: Check the container runs without mjpg-streamer
      become: true
      become_user: "{{ podman_user }}"
      environment: "{{ octoprint_verify_env }}"
      ansible.builtin.command: podman exec octoprint printenv ENABLE_MJPG_STREAMER
      register: octoprint_verify_mjpg_off
      changed_when: false
      failed_when: octoprint_verify_mjpg_off.stdout != 'false'

    - name: Check the replug service, udev rule and detection settings are installed
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/sbin/octoprint-devices
        - /etc/default/octoprint-devices
        - /etc/systemd/system/octoprint-replug@.service
        - /etc/udev/rules.d/70-octoprint.rules
      register: octoprint_verify_files
      failed_when: not octoprint_verify_files.stat.exists

    - name: Check udev accepts the rules file
      ansible.builtin.command: udevadm verify /etc/udev/rules.d/70-octoprint.rules
      changed_when: false

    - name: Check the webcam controls are passed to the detection script, in order
      ansible.builtin.command: >-
        grep -cxF "WEBCAM_CONTROLS='focus_automatic_continuous=0 focus_absolute=0'"
        /etc/default/octoprint-devices
      changed_when: false

    - name: Check the OctoEverywhere plugin is installed in the data dir
      become: true
      become_user: "{{ podman_user }}"
      environment: "{{ octoprint_verify_env }}"
      ansible.builtin.command: podman exec octoprint pip show --files OctoEverywhere
      register: octoprint_verify_oe
      changed_when: false
      failed_when: >-
        octoprint_verify_oe.rc != 0
        or 'Location: /octoprint/plugins/' not in octoprint_verify_oe.stdout

    - name: Check OctoPrint loaded the plugin
      become: true
      become_user: "{{ podman_user }}"
      environment: "{{ octoprint_verify_env }}"
      # The startup log lists plugins as "|  OctoEverywhere! (5.4.1) = <path>".
      ansible.builtin.command: >-
        podman exec octoprint grep -cE '\| +OctoEverywhere!? \('
        /octoprint/octoprint/logs/octoprint.log
      register: octoprint_verify_oe_loaded
      changed_when: false
      until: octoprint_verify_oe_loaded.rc == 0
      retries: 120
      delay: 1

    # Set even with no camera yet, so one plugged in later just works.
    - name: Read the webcam snapshot URL OctoPrint (and Gadget) will use
      become: true
      become_user: "{{ podman_user }}"
      environment: "{{ octoprint_verify_env }}"
      ansible.builtin.command: >-
        podman exec octoprint octoprint --basedir /octoprint/octoprint
        config get --raw plugins.classicwebcam.snapshot
      register: octoprint_verify_snapshot
      changed_when: false
      failed_when: octoprint_verify_snapshot.stdout != 'http://localhost:8080/?action=snapshot'

    - name: Check the Firmware Updater is installed, at the pinned version
      become: true
      become_user: "{{ podman_user }}"
      environment: "{{ octoprint_verify_env }}"
      ansible.builtin.command: podman exec octoprint pip show OctoPrint-FirmwareUpdater
      register: octoprint_verify_fwu
      changed_when: false
      failed_when: >-
        octoprint_verify_fwu.rc != 0
        or 'Version: 1.15.0' not in octoprint_verify_fwu.stdout
        or 'Location: /octoprint/plugins/' not in octoprint_verify_fwu.stdout

    - name: Check OctoPrint loaded the Firmware Updater
      become: true
      become_user: "{{ podman_user }}"
      environment: "{{ octoprint_verify_env }}"
      ansible.builtin.command: >-
        podman exec octoprint grep -cE '\| +Firmware Updater \(1\.15\.0\)'
        /octoprint/octoprint/logs/octoprint.log
      register: octoprint_verify_fwu_loaded
      changed_when: false
      until: octoprint_verify_fwu_loaded.rc == 0
      retries: 120
      delay: 1

    # Read after the plugin has loaded, so this also shows its first-load
    # settings migration didn't replace the profile.
    - name: Read the Firmware Updater's settings
      become: true
      become_user: "{{ podman_user }}"
      environment: "{{ octoprint_verify_env }}"
      ansible.builtin.command: >-
        podman exec octoprint octoprint --basedir /octoprint/octoprint
        config get --json plugins.firmwareupdater
      register: octoprint_verify_fwu_settings
      changed_when: false

    - name: Check the MK3S+ flash profile is selected
      vars:
        fwu: "{{ octoprint_verify_fwu_settings.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - fwu._selected_profile == 0
          - fwu.profiles | length == 1
          - fwu.profiles[0]._name == 'Prusa MK3S+'
          - fwu.profiles[0].flash_method == 'avrdude'
          - fwu.profiles[0].avrdude_path == '/usr/bin/avrdude'
          - fwu.profiles[0].avrdude_avrmcu == 'm2560'
          - fwu.profiles[0].avrdude_programmer == 'wiring'
          - fwu.profiles[0].avrdude_baudrate | int == 115200

    - name: Check avrdude in the container knows the MK3S+ chip and programmer
      become: true
      become_user: "{{ podman_user }}"
      environment: "{{ octoprint_verify_env }}"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -eo pipefail
          # Listing parts or programmers exits non-zero, so check the text.
          parts=$(podman exec octoprint avrdude -p '?' 2>&1 || true)
          programmers=$(podman exec octoprint avrdude -c '?' 2>&1 || true)
          grep -qw m2560 <<<"$parts"
          grep -qw wiring <<<"$programmers"
      changed_when: false

    - name: Read OctoPrint's user list
      ansible.builtin.slurp:
        path: /home/{{ podman_user }}/octoprint/octoprint/users.yaml
      register: octoprint_verify_users

    - name: Check exactly one user exists, the admin the role created
      vars:
        users: "{{ octoprint_verify_users.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - users | dict2items | rejectattr('key', 'match', '^_') | list | length == 1
          - users.admin.active
          - "'admins' in users.admin.groups"

    - name: Check local autologin is off
      become: true
      become_user: "{{ podman_user }}"
      environment: "{{ octoprint_verify_env }}"
      ansible.builtin.command: >-
        podman exec octoprint octoprint --basedir /octoprint/octoprint
        config get --raw accessControl.autologinLocal
      register: octoprint_verify_autologin
      changed_when: false
      failed_when: octoprint_verify_autologin.stdout != 'False'

    # OctoPrint wants its CSRF cookie echoed back in a header on POSTs.
    - name: Get a session cookie like a browser would
      ansible.builtin.uri:
        url: http://localhost/
      register: octoprint_verify_page

    - name: Remember the cookie and its CSRF token
      ansible.builtin.set_fact:
        octoprint_verify_headers:
          Cookie: "{{ octoprint_verify_page.cookies_string }}"
          X-CSRF-Token: >-
            {{ (octoprint_verify_page.cookies | dict2items
                | selectattr('key', 'match', '^csrf_token') | first).value }}

    # On a fresh OctoPrint this request creates an admin (HTTP 204).
    - name: Check a visitor can't make themselves admin through the setup wizard
      ansible.builtin.uri:
        url: http://localhost/plugin/corewizard/acl
        method: POST
        headers: "{{ octoprint_verify_headers }}"
        body_format: json
        body: {user: intruder, pass1: intruder123, pass2: intruder123}
        status_code: 403

    - name: Check a wrong password is refused
      ansible.builtin.uri:
        url: http://localhost/api/login
        method: POST
        headers: "{{ octoprint_verify_headers }}"
        body_format: json
        body: {user: admin, pass: not-the-password}
        status_code: 403

    - name: Check the admin can log in with the generated password
      ansible.builtin.uri:
        url: http://localhost/api/login
        method: POST
        headers: "{{ octoprint_verify_headers }}"
        body_format: json
        body:
          user: admin
          pass: "{{ lookup('file', lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/octoprint-admin') }}"
        return_content: true
      register: octoprint_verify_login
      failed_when: >-
        octoprint_verify_login.status != 200
        or 'admins' not in octoprint_verify_login.json.groups
      no_log: true

    # Last, because it restarts OctoPrint. Plug in a Prusa and a C920 the
    # way udev would: device nodes plus their by-id links, then start
    # octoprint-replug@video like the udev rule does. The nodes are copies
    # of /dev/null (char 1,3) owned like real ones (root:dialout, root:video
    # 0660), so writes succeed only if the container kept those groups.
    - name: Plug in a fake printer and webcam
      ansible.builtin.shell: |
        set -e
        mkdir -p /dev/serial/by-id /dev/v4l/by-id
        [ -c /dev/ttyACM0 ] || mknod /dev/ttyACM0 c 1 3
        chown root:dialout /dev/ttyACM0 && chmod 0660 /dev/ttyACM0
        [ -c /dev/video0 ] || mknod /dev/video0 c 1 3
        chown root:video /dev/video0 && chmod 0660 /dev/video0
        ln -sfn ../../ttyACM0 /dev/serial/by-id/{{ octoprint_verify_printer }}
        ln -sfn ../../video0 /dev/v4l/by-id/{{ octoprint_verify_webcam }}
      changed_when: true

    - name: Remember when the container was started
      become: true
      become_user: "{{ podman_user }}"
      environment: "{{ octoprint_verify_env }}"
      ansible.builtin.command: podman inspect --format '{{ '{{' }}.State.StartedAt{{ '}}' }}' octoprint
      register: octoprint_verify_started_before
      changed_when: false

    - name: Run the camera replug service like udev would
      ansible.builtin.systemd_service:
        name: octoprint-replug@video.service
        state: started

    - name: Read the device drop-in
      ansible.builtin.slurp:
        path: /home/{{ podman_user }}/.config/containers/systemd/octoprint.container.d/50-devices.conf
      register: octoprint_verify_dropin

    - name: Check the drop-in now has the Prusa and the C920 by their by-id paths
      vars:
        dropin: "{{ octoprint_verify_dropin.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "('AddDevice=-/dev/serial/by-id/' ~ octoprint_verify_printer ~ ':/dev/ttyACM0') in dropin"
          - "('AddDevice=-/dev/v4l/by-id/' ~ octoprint_verify_webcam ~ ':/dev/video0') in dropin"
          - "'Environment=ENABLE_MJPG_STREAMER=true' in dropin"
          - "'Environment=\"MJPG_STREAMER_INPUT=-n -r 1280x720 -f 15\"' in dropin"

    - name: Wait for OctoPrint to restart with the webcam
      become: true
      become_user: "{{ podman_user }}"
      environment: "{{ octoprint_verify_env }}"
      ansible.builtin.shell: |
        set -e
        started=$(podman inspect --format '{{ '{{' }}.State.StartedAt{{ '}}' }}' octoprint)
        [ "$started" != {{ octoprint_verify_started_before.stdout | quote }} ]
        [ "$(podman exec octoprint printenv ENABLE_MJPG_STREAMER)" = true ]
      register: octoprint_verify_restarted
      changed_when: false
      until: octoprint_verify_restarted.rc == 0
      retries: 300
      delay: 1

    - name: Check the printer and webcam were passed through, and are writable
      become: true
      become_user: "{{ podman_user }}"
      environment: "{{ octoprint_verify_env }}"
      ansible.builtin.command: >-
        podman exec octoprint sh -c
        'test -c /dev/ttyACM0 && echo M115 > /dev/ttyACM0 && test -c /dev/video0 && : > /dev/video0'
      changed_when: false

    - name: Check the web UI came back
      ansible.builtin.uri:
        url: http://localhost/
        status_code: [200, 302]
      register: octoprint_verify_http_again
      until: octoprint_verify_http_again.status in [200, 302]
      retries: 300
      delay: 1

    - name: Check the camera replug didn't restart OctoPrint again (nothing changed)
      ansible.builtin.command: /usr/local/sbin/octoprint-devices video
      register: octoprint_verify_replug_again
      changed_when: false
      failed_when: "'changed=no' not in octoprint_verify_replug_again.stdout_lines"
