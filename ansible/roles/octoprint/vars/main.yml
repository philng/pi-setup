---
# OctoPrint settings the role keeps in place unless the webcam is "off", per the
# octoprint-docker README. mjpg-streamer listens on 8080 inside the
# container; haproxy serves the stream to browsers under /webcam/.
octoprint_webcam_settings:
  plugins.classicwebcam.stream: "{{ octoprint_webcam_stream_url }}"
  plugins.classicwebcam.snapshot: "{{ octoprint_webcam_snapshot_url }}"
  webcam.ffmpeg: /usr/bin/ffmpeg

# Run inside the container as the rootless user.
octoprint_exec: podman exec octoprint
# With stdin attached, for commands that read a password.
octoprint_exec_stdin: podman exec -i octoprint
octoprint_cli: "{{ octoprint_exec }} octoprint --basedir /octoprint/octoprint"

# The Firmware Updater's settings version (get_settings_version() in the
# plugin, 3 since 1.13). Written with the profile so the plugin doesn't run
# its old-settings migration on first load, which would replace the profile.
octoprint_firmwareupdater_settings_version: 3

# Quadlet drop-in with the printer and webcam, written by octoprint-devices.
octoprint_devices_dropin: "{{ podman_user_home }}/.config/containers/systemd/octoprint.container.d/50-devices.conf"

# How long to wait for OctoPrint's web UI after a (re)start: tries, 2 s apart.
octoprint_start_retries: 450
