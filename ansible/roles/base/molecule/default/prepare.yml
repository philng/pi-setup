---
# Make the container look like a Pi after first boot, before Ansible: the
# login user cloud-init made, with a key that isn't in the keys file, and the
# image's old name in /etc/hosts.
- name: Prepare
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Login user from first boot
      ansible.builtin.user:
        name: admin
        shell: /bin/bash

    - name: A key that isn't in the keys file any more
      ansible.posix.authorized_key:
        user: admin
        key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKV1JSXhRJTTnk3dHk2M4CUW/SGNlYalU2nU7JLo3TzM molecule-stray"

    - name: Old hostname in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "127.0.1.1\traspberrypi"
        unsafe_writes: true
