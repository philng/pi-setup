---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the "configured" marker
      ansible.builtin.stat:
        path: /var/lib/pi-setup-applied
      register: base_verify_marker

    - name: Marker exists, so make check will accept this Pi
      ansible.builtin.assert:
        that: base_verify_marker.stat.exists

    - name: Read live firewall table
      ansible.builtin.command: nft list table inet pilab
      register: base_verify_nft
      changed_when: false

    - name: Firewall is default-deny with SSH from LAN and the extra ports
      ansible.builtin.assert:
        that:
          - "'policy drop' in base_verify_nft.stdout"
          - "'tcp dport 22 accept' in base_verify_nft.stdout"
          - "'ip saddr @lan4 tcp dport 8080 accept' in base_verify_nft.stdout"
          - "'udp dport 9999 accept' in base_verify_nft.stdout"

    - name: Ruleset on disk passes nft's own check
      ansible.builtin.command: nft -c -f /etc/nftables.conf
      changed_when: false

    - name: Read nftables unit state
      ansible.builtin.systemd_service:
        name: nftables
      register: base_verify_unit

    - name: Nftables enabled and active (oneshot, so "active (exited)")
      ansible.builtin.assert:
        that:
          - base_verify_unit.status.ActiveState == 'active'
          - base_verify_unit.status.UnitFileState == 'enabled'

    - name: Read sshd effective config
      ansible.builtin.command: /usr/sbin/sshd -T
      register: base_verify_sshd
      changed_when: false

    - name: Password and root login are off
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in base_verify_sshd.stdout"
          - "'permitrootlogin no' in base_verify_sshd.stdout"

    - name: Read journald and unattended-upgrades config
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/systemd/journald.conf.d/10-pilab.conf
        - /etc/apt/apt.conf.d/52pilab-unattended-upgrades
        - /etc/apt/apt.conf.d/20auto-upgrades
      register: base_verify_files

    - name: Logs in RAM, unattended upgrades on incl. Raspberry Pi archive
      ansible.builtin.assert:
        that:
          - "'Storage=volatile' in (base_verify_files.results[0].content | b64decode)"
          - "'Raspberry Pi Foundation' in (base_verify_files.results[1].content | b64decode)"
          - "'Unattended-Upgrade \"1\"' in (base_verify_files.results[2].content | b64decode)"

    - name: Unattended-upgrades accepts the config
      ansible.builtin.command: unattended-upgrade --dry-run
      changed_when: false

    - name: Fail2ban is protecting SSH
      ansible.builtin.command: fail2ban-client status sshd
      register: base_verify_f2b
      changed_when: false
      failed_when: base_verify_f2b.rc != 0 or 'Currently banned' not in base_verify_f2b.stdout

    - name: Fail2ban bans with nftables
      ansible.builtin.command: fail2ban-client get sshd actions
      register: base_verify_f2b_action
      changed_when: false
      failed_when: "'nftables' not in base_verify_f2b_action.stdout"

    - name: Read chrony and watchdog state
      ansible.builtin.systemd_service:
        name: chrony
      register: base_verify_chrony

    - name: Chrony is the active time service
      ansible.builtin.assert:
        that:
          - base_verify_chrony.status.ActiveState == 'active'
          - base_verify_chrony.status.UnitFileState == 'enabled'

    - name: Systemd picked up the hardware watchdog setting
      ansible.builtin.command: systemctl show --property=RuntimeWatchdogUSec  # noqa: command-instead-of-module
      register: base_verify_wd
      changed_when: false
      failed_when: base_verify_wd.stdout != 'RuntimeWatchdogUSec=15s'

    # Settings that used to be first-boot only (bootstrap/cloud-init/).
    - name: Read hosts, timezone, keyboard and authorized_keys
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/hosts
        - /etc/default/keyboard
        - /home/admin/.ssh/authorized_keys
      register: base_verify_system

    - name: Read the timezone link
      ansible.builtin.stat:
        path: /etc/localtime
      register: base_verify_tz

    - name: Hostname in /etc/hosts, timezone and keyboard applied
      ansible.builtin.assert:
        that:
          - base_verify_system.results[0].content | b64decode is search('(?m)^127\\.0\\.1\\.1\\s+pi$')
          - "'raspberrypi' not in (base_verify_system.results[0].content | b64decode)"
          - "'XKBLAYOUT=\"us\"' in (base_verify_system.results[1].content | b64decode)"
          - base_verify_tz.stat.lnk_source is search('Europe/London')

    - name: Exactly the keys in the keys file (the stray one is gone)
      ansible.builtin.assert:
        that:
          - base_verify_keys | length == 2
          - base_verify_keys | select('search', 'molecule-one') | list | length == 1
          - base_verify_keys | select('search', 'molecule-two') | list | length == 1
      vars:
        base_verify_keys: >-
          {{ base_verify_system.results[2].content | b64decode | split('\n') | select | list }}

    - name: Read the login user
      ansible.builtin.getent:
        database: shadow
        key: admin

    - name: Login user has no usable password
      ansible.builtin.assert:
        that: ansible_facts['getent_shadow']['admin'][0] is match('!')

    - name: Read the login user's groups
      ansible.builtin.command: id -nG admin
      register: base_verify_groups
      changed_when: false

    - name: Login user is in sudo and dialout (groups the Pi lacks are skipped)
      ansible.builtin.assert:
        that:
          - "'sudo' in base_verify_groups.stdout.split()"
          - "'dialout' in base_verify_groups.stdout.split()"

    - name: Login user can sudo without a password
      ansible.builtin.command: sudo -n -u admin sudo -n true
      changed_when: false

    - name: Read cloud-init's off switch
      ansible.builtin.stat:
        path: /etc/cloud/cloud-init.disabled
      register: base_verify_ci

    - name: Cloud-init won't run again at boot
      ansible.builtin.assert:
        that: base_verify_ci.stat.exists

    - name: Read SSH service state
      ansible.builtin.systemd_service:
        name: ssh
      register: base_verify_ssh

    - name: SSH is enabled and running
      ansible.builtin.assert:
        that:
          - base_verify_ssh.status.ActiveState == 'active'
          - base_verify_ssh.status.UnitFileState == 'enabled'
