---
# reload, not restart: nftables.service's stop runs "flush ruleset", which
# would also wipe Podman's tables.
- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
