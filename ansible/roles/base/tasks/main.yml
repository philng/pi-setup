---
- name: Packages
  ansible.builtin.import_tasks: packages.yml

- name: Firewall
  ansible.builtin.import_tasks: firewall.yml

- name: SSH hardening
  ansible.builtin.import_tasks: ssh.yml

- name: Brute-force protection
  ansible.builtin.import_tasks: fail2ban.yml

- name: Time sync and watchdog
  ansible.builtin.import_tasks: reliability.yml

- name: Logging
  ansible.builtin.import_tasks: logging.yml

- name: Bootloader EEPROM
  ansible.builtin.import_tasks: eeprom.yml
  when: base_manage_eeprom | bool
