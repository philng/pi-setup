---
- name: Packages
  ansible.builtin.import_tasks: packages.yml

- name: Firewall
  ansible.builtin.import_tasks: firewall.yml

- name: SSH hardening
  ansible.builtin.import_tasks: ssh.yml

- name: Brute-force protection
  ansible.builtin.import_tasks: fail2ban.yml

- name: Time sync and watchdog
  ansible.builtin.import_tasks: reliability.yml

- name: Logging
  ansible.builtin.import_tasks: logging.yml

- name: Bootloader EEPROM
  ansible.builtin.import_tasks: eeprom.yml
  when: base_manage_eeprom | bool

# site.yml looks for this before a dry run (make check): a Pi that has never
# had a real `make apply` has nothing to compare against, so it stops there.
- name: Record that this Pi has been configured
  ansible.builtin.copy:
    dest: /var/lib/pi-setup-applied
    content: "Configured by pi-setup (make apply). Remove to make `make check` refuse this Pi.\n"
    owner: root
    group: root
    mode: "0644"
