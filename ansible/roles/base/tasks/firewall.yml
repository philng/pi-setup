---
- name: Create drop-in directory for role firewall rules
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Rules from base_firewall_allow
  ansible.builtin.template:
    src: 10-base-allow.nft.j2
    dest: /etc/nftables.d/10-base-allow.nft
    owner: root
    group: root
    mode: "0644"
  notify: Reload nftables

- name: Main nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
    validate: nft -c -f %s
  notify: Reload nftables

- name: Enable nftables
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
