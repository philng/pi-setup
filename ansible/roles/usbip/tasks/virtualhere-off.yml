---
# Undo the virtualhere role on a Pi switched back to usbip, so the two never
# fight over the same dongles. Does nothing on a Pi that never ran VirtualHere.
# Removes its container, image and binary; only its settings folder
# (/usr/local/etc/virtualhere, with nicknames and licence) stays, so switching
# back keeps them.
- name: Look for VirtualHere's units
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/containers/systemd/virtualhere.container
    - /etc/systemd/system/virtualhere.service  # the native one, before containers
  register: usbip_virtualhere_units

- name: Stop VirtualHere
  ansible.builtin.systemd_service:
    name: virtualhere
    state: stopped
  when: usbip_virtualhere_units.results | selectattr('stat.exists') | list | length > 0

- name: Remove VirtualHere's unit, binary and firewall opening
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/containers/systemd/virtualhere.container
    - /etc/systemd/system/virtualhere.service
    - /usr/local/lib/virtualhere
    - /usr/local/sbin/vhusbdarm64
    - /etc/nftables.d/35-virtualhere.nft
  notify: [Reload nftables, Reload systemd, Remove VirtualHere's base image]
