---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# After a switch back from VirtualHere (tasks/virtualhere-off.yml).
- name: Remove VirtualHere's base image
  ansible.builtin.command: podman rmi --ignore {{ usbip_virtualhere_image }}
  register: usbip_virtualhere_rmi
  changed_when: usbip_virtualhere_rmi.stdout | length > 0
  failed_when: false  # in use by something else, or Podman not installed: leave it

- name: Reload udev and export plugged-in devices
  ansible.builtin.shell: |
    set -e
    udevadm control --reload-rules
    udevadm trigger --action=add --subsystem-match=usb --property-match=DEVTYPE=usb_device
  changed_when: true
  when: usbip_manage_kernel | bool
  tags: [molecule-notest]

- name: Restart usbipd
  ansible.builtin.systemd_service:
    name: usbipd
    state: restarted
  when: usbip_manage_kernel | bool
  tags: [molecule-notest]

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
