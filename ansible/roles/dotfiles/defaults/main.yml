---
# Login user that gets zsh and the dotfiles. Set in group_vars/pis.yml.
dotfiles_user: admin
# Public repo, cloned on the Pi over HTTPS. Its files under home/ are linked
# into the user's home, like the repo's own install.sh does.
dotfiles_repo: https://github.com/philng/dotfiles.git
# Branch, tag or commit; HEAD is the default branch. A branch is pulled again on every run.
dotfiles_version: HEAD
dotfiles_dest: .dotfiles  # relative to the user's home

# Tools the dotfiles use when present (fzf keys, eza aliases, tmux config).
dotfiles_packages:
  - zsh
  - vim
  - git
  - curl
  - fzf
  - eza
  - tmux
  - acl  # lets Ansible become the unprivileged user

# Plugin managers the dotfiles expect (machine-setup installs these on desktops).
dotfiles_antidote_repo: https://github.com/mattmc3/antidote.git
dotfiles_antidote_version: v2.3.0
dotfiles_vim_plug_url: https://raw.githubusercontent.com/junegunn/vim-plug/0.15.0/plug.vim
