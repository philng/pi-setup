---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart VirtualHere
  ansible.builtin.systemd_service:
    name: virtualhere
    state: restarted
  when: virtualhere_start | bool

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
