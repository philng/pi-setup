---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  vars:
    virtualhere_verify_conf: /usr/local/etc/virtualhere
  tasks:
    - name: Find the server binary
      ansible.builtin.stat:
        path: /usr/local/sbin/vhusbdarm64
      register: virtualhere_verify_bin

    - name: The arm64 server is installed and executable
      ansible.builtin.assert:
        that: virtualhere_verify_bin.stat.executable

    - name: Systemd accepts the units
      ansible.builtin.command: >-
        systemd-analyze verify /etc/systemd/system/virtualhere.service /etc/systemd/system/usbipd.service
      changed_when: false

    - name: Gather service state
      ansible.builtin.service_facts:

    - name: VirtualHere is enabled and usbip is switched off
      ansible.builtin.assert:
        that:
          - ansible_facts.services['virtualhere.service'].status == 'enabled'
          - ansible_facts.services['usbipd.service'].status == 'disabled'
          - ansible_facts.services['usbipd.service'].state != 'running'

    - name: Look for usbip's leftovers
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/udev/rules.d/90-usbip-export.rules
        - /etc/modules-load.d/usbip.conf
        - /etc/nftables.d/30-usbip.nft
      register: virtualhere_verify_usbip_files

    - name: Usbip no longer exports anything on plug-in
      ansible.builtin.assert:
        that: virtualhere_verify_usbip_files.results | selectattr('stat.exists') | list | length == 0

    - name: Read the live firewall
      ansible.builtin.command: nft list table inet pilab
      register: virtualhere_verify_nft
      changed_when: false

    - name: Port 7575 is open to the LAN and 3240 is closed
      ansible.builtin.assert:
        that:
          - "'tcp dport 7575 accept' in virtualhere_verify_nft.stdout"
          - "'tcp dport 3240' not in virtualhere_verify_nft.stdout"

    - name: Read the managed settings
      ansible.builtin.slurp:
        src: "{{ virtualhere_verify_conf }}/managed.ini"
      register: virtualhere_verify_managed

    - name: Find the managed settings
      ansible.builtin.stat:
        path: "{{ virtualhere_verify_conf }}/managed.ini"
      register: virtualhere_verify_managed_stat

    - name: Only the dongles are shared, and the licence came from the secrets file
      ansible.builtin.assert:
        that:
          - "'\nAllowedDevices=28de/*,2dc8/*,37d7/*,1997/2433,45e/28e\n' in ini"
          - "'\nServerName=' in ini"
          - "'\nLicense=FAKE-LICENCE-FOR-TESTS\n' in ini"
          - virtualhere_verify_managed_stat.stat.mode == '0600'
      vars:
        ini: "{{ virtualhere_verify_managed.content | b64decode }}"

    - name: Merge into a config.ini the server has written to
      ansible.builtin.shell: |
        set -e
        d=$(mktemp -d)
        printf 'ServerName=new\nAllowedDevices=1/2\n' > "$d/managed.ini"
        printf 'servername=old\nDeviceNicknames=pad,28de,1304,1\nallowedDEVICES=all\n' > "$d/config.ini"
        /usr/local/libexec/virtualhere-config "$d/managed.ini" "$d/config.ini"
        cat "$d/config.ini"
        stat -c %a "$d/config.ini"
        # A missing config.ini is created.
        /usr/local/libexec/virtualhere-config "$d/managed.ini" "$d/fresh.ini"
        cat "$d/fresh.ini"
      register: virtualhere_verify_merge
      changed_when: false

    - name: Ansible's keys replace the server's, the server's own keys stay
      ansible.builtin.assert:
        that:
          - virtualhere_verify_merge.stdout_lines == [
              'DeviceNicknames=pad,28de,1304,1', 'ServerName=new', 'AllowedDevices=1/2',
              '600', 'ServerName=new', 'AllowedDevices=1/2']
        fail_msg: "{{ virtualhere_verify_merge.stdout_lines }}"

    # The real server, started from its unit (without the fake licence, which
    # it would rightly refuse): it must come up and listen on its port.
    - name: Start the server without the fake licence
      ansible.builtin.shell: |
        set -eo pipefail
        sed -i '/^License=/d' {{ virtualhere_verify_conf }}/managed.ini
        rm -f {{ virtualhere_verify_conf }}/config.ini
        systemctl start virtualhere
        for _ in $(seq 20); do
          ss -Hltn 'sport = :7575' | grep -q . && exit 0
          sleep 0.5
        done
        systemctl status virtualhere --no-pager || true
        exit 1
      args:
        executable: /bin/bash
      changed_when: false

    - name: The server wrote its settings into config.ini
      ansible.builtin.command: cat {{ virtualhere_verify_conf }}/config.ini
      register: virtualhere_verify_config
      changed_when: false
      failed_when: "'AllowedDevices=28de/*' not in virtualhere_verify_config.stdout"
