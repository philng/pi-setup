---
# Package source: Tailscale's apt repo, signed by a key pinned by checksum.
- name: Download Tailscale's apt signing key (pinned by checksum)
  ansible.builtin.get_url:
    url: "{{ tailscale_apt_key_url }}"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    checksum: "{{ tailscale_apt_key_checksum }}"
    owner: root
    group: root
    mode: "0644"

- name: Add Tailscale's apt repository
  ansible.builtin.template:
    src: tailscale.sources.j2
    dest: /etc/apt/sources.list.d/tailscale.sources
    owner: root
    group: root
    mode: "0644"
  register: tailscale_repo

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: "{{ tailscale_repo is changed }}"
  register: tailscale_package

# Adds to the base role's list of origins (apt merges the lists).
- name: Let unattended-upgrades update Tailscale
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/53pilab-tailscale-upgrades
    content: |
      // Managed by Ansible (tailscale role)
      Unattended-Upgrade::Origins-Pattern {
              "origin=Tailscale";
      };
    owner: root
    group: root
    mode: "0644"
  when: tailscale_auto_update | bool

- name: Leave Tailscale updates to you
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/53pilab-tailscale-upgrades
    state: absent
  when: not tailscale_auto_update | bool

- name: Let the tailnet in through the firewall
  ansible.builtin.template:
    src: 20-tailscale.nft.j2
    dest: /etc/nftables.d/20-tailscale.nft
    owner: root
    group: root
    mode: "0644"
  notify: Reload nftables

# The rules above go live now, before anything can start using the tailnet.
- name: Apply firewall changes
  ansible.builtin.meta: flush_handlers

# A dry run (make check) on a Pi that doesn't have Tailscale yet stops here:
# there is no tailscaled to ask.
- name: Start Tailscale and join the tailnet
  ansible.builtin.import_tasks: login.yml
  when: not (ansible_check_mode and tailscale_package is changed)
