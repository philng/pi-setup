---
- name: Enable tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

# Right after starting, tailscaled reports NoState for a moment.
- name: Read Tailscale's state
  ansible.builtin.command: tailscale status --json --peers=false
  register: tailscale_status_raw
  changed_when: false
  failed_when: false
  check_mode: false
  retries: 15
  delay: 2
  until: >-
    tailscale_status_raw.stdout is match('\\s*\\{')
    and (tailscale_status_raw.stdout | from_json).get('BackendState', '') not in ['', 'NoState']

- name: Work out whether this Pi is in the tailnet
  ansible.builtin.set_fact:
    tailscale_state: "{{ (tailscale_status_raw.stdout | from_json).BackendState }}"

# Logged in already (Running, or Stopped by `tailscale down`): leave it be.
# Logged out: with an auth key (TAILSCALE_AUTHKEY), join straight away;
# otherwise print Tailscale's login link and wait for you to open it.
- name: Join the tailnet
  when: tailscale_state == 'NeedsLogin' and not ansible_check_mode
  block:
    # A file, so the key never shows up in the process list.
    - name: Hand the auth key to the Pi
      ansible.builtin.copy:
        dest: /run/tailscale-authkey
        content: "{{ tailscale_authkey }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: tailscale_authkey | length > 0

    # --reset: the flags below are the whole configuration, whatever was set
    # before. Without a key, `up` asks the Tailscale servers for a login link
    # and gives up waiting after a few seconds; tailscaled keeps the link, and
    # the Pi joins whenever it is opened.
    - name: Start logging in
      ansible.builtin.command:
        argv: "{{ ['tailscale', 'up', '--reset',
                   '--timeout=' ~ ('60s' if tailscale_authkey | length > 0 else '10s'),
                   '--hostname=' ~ tailscale_hostname,
                   '--ssh=' ~ (tailscale_ssh | bool | lower)]
                  + (['--auth-key=file:/run/tailscale-authkey'] if tailscale_authkey | length > 0 else [])
                  + tailscale_up_args }}"
      register: tailscale_up
      changed_when: tailscale_up.rc == 0
      failed_when: tailscale_up.rc != 0 and tailscale_authkey | length > 0

    - name: Read the login link
      ansible.builtin.command: tailscale status --json --peers=false
      register: tailscale_login_raw
      changed_when: false
      retries: 10
      delay: 2
      until: >-
        (tailscale_login_raw.stdout | from_json).BackendState == 'Running'
        or (tailscale_login_raw.stdout | from_json).AuthURL | default('', true) | length > 0
      when: tailscale_up.rc != 0

    - name: Ask you to open the login link
      ansible.builtin.debug:
        msg:
          - "ACTION NEEDED: add {{ inventory_hostname }} to your tailnet by opening this link"
          - "  {{ (tailscale_login_raw.stdout | from_json).AuthURL }}"
          - "{{ 'Waiting up to ' ~ tailscale_login_wait ~ ' seconds for you to approve it...'
                if tailscale_login_wait | int > 0
                else 'Not waiting (tailscale_login_wait is 0). It joins whenever you open the link.' }}"
      when:
        - tailscale_login_raw is not skipped
        - (tailscale_login_raw.stdout | from_json).BackendState != 'Running'

    - name: Wait for you to approve the Pi
      ansible.builtin.command: tailscale status --json --peers=false
      register: tailscale_wait_raw
      changed_when: (tailscale_wait_raw.stdout | from_json).BackendState == 'Running'
      failed_when: false
      retries: "{{ (tailscale_login_wait | int / 5) | round(0, 'ceil') | int }}"
      delay: 5
      until: (tailscale_wait_raw.stdout | from_json).BackendState == 'Running'
      when:
        - tailscale_login_raw is not skipped
        - (tailscale_login_raw.stdout | from_json).BackendState != 'Running'
        - tailscale_login_wait | int > 0

    - name: Note the result
      ansible.builtin.set_fact:
        tailscale_state: >-
          {{ 'Running' if tailscale_up.rc == 0
             else (tailscale_wait_raw.stdout | default(tailscale_login_raw.stdout) | from_json).BackendState }}
  always:
    - name: Remove the auth key from the Pi
      ansible.builtin.file:
        path: /run/tailscale-authkey
        state: absent

- name: Say why this Pi isn't in the tailnet
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ inventory_hostname }} is not in your tailnet yet:
      {{ 'it is waiting for approval in the Tailscale admin console (Machines).'
         if tailscale_state == 'NeedsMachineAuth' else
         'open the login link printed above (it stays valid), or run make apply again for a new one.'
         if tailscale_state == 'NeedsLogin' else
         'Tailscale reports ' ~ tailscale_state ~ '.' }}
  when: tailscale_state not in ['Running', 'Stopped', 'Starting'] and not ansible_check_mode

# Tailscale SSH on or off, also on a Pi that joined earlier.
- name: Read Tailscale's settings
  ansible.builtin.command: tailscale debug prefs
  register: tailscale_prefs
  changed_when: false
  check_mode: false

# When Ansible itself is connected over the tailnet, switching Tailscale SSH
# hands port 22 on the tailnet address to (or back from) tailscaled, which cuts
# this very SSH session. `tailscale set` refuses unless told --accept-risk, and
# even then its answer would be lost with the session. So it runs detached (async,
# not polled) a moment after the task returns; then Ansible drops its old
# connection and waits until it can log in again, now through Tailscale SSH.
- name: Switch Tailscale SSH {{ 'on' if tailscale_ssh | bool else 'off' }}
  when:
    - (tailscale_prefs.stdout | from_json).RunSSH | default(false) | bool != tailscale_ssh | bool
    - not ansible_check_mode  # async can't run in check mode
  block:
    - name: Turn Tailscale SSH {{ 'on' if tailscale_ssh | bool else 'off' }}
      ansible.builtin.shell: >-
        sleep 2 && tailscale set --ssh={{ tailscale_ssh | bool | lower }} --accept-risk=lose-ssh
      async: 60
      poll: 0
      changed_when: true

    - name: Drop the SSH connection that Tailscale SSH may have cut
      ansible.builtin.meta: reset_connection

    - name: Wait until Ansible can log in again
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 90
  rescue:
    - name: Explain the lost connection
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} turned Tailscale SSH {{ 'on' if tailscale_ssh | bool else 'off' }},
          but Ansible couldn't log in again over the tailnet afterwards
          ({{ ansible_failed_result.msg | default('no answer') }}).
          {{ 'Tailscale let the connection in but held it for a browser check:'
             ~ ' your tailnet policy SSH rule has "action": "check".'
             if 'privilege escalation' in (ansible_failed_result.msg | default(''))
             else 'Usually the tailnet policy has no "accept" SSH rule for you.' }}
          Change the rule to "action": "accept" (docs/tailscale.md#tailscale-ssh) and run make apply again.
          To see it yourself: ssh {{ ansible_user }}@{{ ansible_host | default(inventory_hostname) }} true
          prints a login.tailscale.com link while the rule is "check".
          SSH over the LAN with your key still works.

- name: Check Tailscale SSH is {{ 'on' if tailscale_ssh | bool else 'off' }}
  ansible.builtin.command: tailscale debug prefs
  register: tailscale_prefs_after
  changed_when: false
  failed_when: (tailscale_prefs_after.stdout | from_json).RunSSH | default(false) | bool != tailscale_ssh | bool
  when: not ansible_check_mode
