---
# One group per job. Every Pi is also in `pis`, which gets the shared roles.
# Only list Pis that exist: `make new-pi` adds each one here as you set it up,
# and a group with no hosts yet is simply skipped by every make target.
# ansible_host is the plain hostname, resolved by the router's DNS. Give each Pi
# a DHCP reservation; if a name doesn't resolve, put the Pi's IP here instead.
all:
  children:
    pis:
      children:
        usbip:
          # The USB-over-IP Pi (usually pilab) goes here: make new-pi --role usbip
          hosts:
        printers:
          hosts:
            octopi:
              ansible_host: octopi
