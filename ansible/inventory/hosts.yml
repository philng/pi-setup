---
# One group per job. Every Pi is also in `pis`, which gets the shared roles.
# ansible_host is the plain hostname, resolved by the router's DNS. Give each Pi
# a DHCP reservation; if a name doesn't resolve, put the Pi's IP here instead.
all:
  children:
    pis:
      children:
        usbip:
          hosts:
            pilab:
              ansible_host: pilab
        printers:
          hosts:
            octopi:
              ansible_host: octopi
