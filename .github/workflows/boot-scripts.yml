---
# Run the boot-partition scripts on every OS you might flash from.
# macOS minutes bill at 10x and Windows at 2x on a private repo, so this runs
# only when the scripts or their templates change, or by hand.
name: boot-scripts
on:
  push:
    branches: [main]
    paths:
      - scripts/configure-boot.*
      - bootstrap/**
      - .github/workflows/boot-scripts.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - scripts/configure-boot.*
      - bootstrap/**
      - .github/workflows/boot-scripts.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Against a fake bootfs folder; check the result parses as YAML.
  configure-boot:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make a fake bootfs and SSH key
        shell: bash
        run: |
          mkdir -p fakeboot keys
          touch fakeboot/config.txt fakeboot/cmdline.txt
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAItest ci@example" > keys/id.pub
          mkdir -p fakeboot2
          touch fakeboot2/config.txt fakeboot2/cmdline.txt
      - name: Run configure-boot.sh
        if: runner.os != 'Windows'
        run: |
          SSH_PUBKEY_FILE=keys/id.pub scripts/configure-boot.sh fakeboot
          PI_HOSTNAME=octopi SSH_PUBKEY_FILE=keys/id.pub scripts/configure-boot.sh fakeboot2
      - name: Run configure-boot.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          scripts\configure-boot.ps1 -Boot fakeboot -SshPubKeyFile keys\id.pub
          scripts\configure-boot.ps1 -Boot fakeboot2 -SshPubKeyFile keys\id.pub -Hostname octopi
      - name: Check output
        shell: bash
        run: |
          python3 -m pip install -q pyyaml
          python3 - <<'PY'
          import yaml
          for boot, host in [("fakeboot", "pilab"), ("fakeboot2", "octopi")]:
              raw = open(f"{boot}/user-data", "rb").read()
              assert not raw.startswith(b"\xef\xbb\xbf"), "BOM in user-data"
              assert b"\r\n" not in raw, "CRLF in user-data"
              assert raw.startswith(b"#cloud-config"), "missing #cloud-config header"
              d = yaml.safe_load(raw)
              assert d["hostname"] == host, d["hostname"]
              assert d["users"][0]["ssh_authorized_keys"][0].endswith("ci@example")
              assert yaml.safe_load(open(f"{boot}/network-config"))["network"]["version"] == 2
              assert open(f"{boot}/meta-data").read().strip() == f"instance-id: {host}"
          print("ok")
          PY
