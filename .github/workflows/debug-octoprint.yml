---
# TEMPORARY: find out why stopping the OctoPrint container takes ~90s.
name: debug-octoprint
on:
  pull_request:
jobs:
  stop-timing:
    runs-on: ubuntu-24.04-arm
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core molecule "molecule-plugins[docker]" docker
      - run: make deps && ansible-galaxy collection install community.docker
      - run: make molecule-image
      - run: cd ansible/roles/octoprint && molecule create && molecule prepare && molecule converge
      - name: Inspect and time a restart
        if: always()
        run: |
          set +e
          u() { docker exec pi bash -c "cd /tmp && sudo -u pods XDG_RUNTIME_DIR=/run/user/\$(id -u pods) $1"; }
          u 'systemctl --user cat octoprint.service'
          u 'systemctl --user show octoprint.service -p ExecStart -p ExecStop -p ExecStopPost -p KillMode -p KillSignal -p TimeoutStopUSec -p Type'
          u 'podman inspect octoprint --format "{{.Config.StopSignal}} {{.Config.StopTimeout}} {{.Config.Entrypoint}} {{.Config.Cmd}}"'
          u 'podman ps -a'
          docker exec pi date +%T.%N
          u 'systemctl --user restart octoprint.service'
          docker exec pi date +%T.%N
          docker exec pi journalctl --no-pager -n 200 --since "-3min"
