---
name: lint
on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - "**.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - docs/**
      - "**.md"

# A new push to a PR cancels the run for the push before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The same pinned tools as `make deps-dev` locally (requirements-dev.txt).
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt
      # Refreshed weekly, so new collection releases still get tested.
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache Ansible collections
        uses: actions/cache@v4
        with:
          path: ansible/.collections
          key: collections-v2-lint-${{ steps.week.outputs.week }}-${{ hashFiles('ansible/requirements.yml') }}
      - run: make deps-dev
      - run: make lint
      - name: Client auto-attach tests
        run: tests/client/test-autoattach.sh
      - name: New-Pi wizard tests
        run: tests/bootstrap/test-new-pi.sh
