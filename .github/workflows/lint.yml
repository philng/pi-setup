---
name: lint
on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - "**.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - docs/**
      - "**.md"

# A new push to a PR cancels the run for the push before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/lint.yml
      - run: pip install ansible-core ansible-lint yamllint shellcheck-py
      # Refreshed weekly, so new collection releases still get tested.
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache Ansible collections
        id: collections
        uses: actions/cache@v4
        with:
          path: ansible/.collections
          key: collections-lint-${{ steps.week.outputs.week }}-${{ hashFiles('ansible/requirements.yml') }}
      - if: steps.collections.outputs.cache-hit != 'true'
        run: make deps
      - run: make lint
      - name: Client auto-attach tests
        run: tests/client/test-autoattach.sh
      - name: New-Pi wizard tests
        run: tests/bootstrap/test-new-pi.sh
