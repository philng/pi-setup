---
name: lint
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the run for the push before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/lint.yml
      - run: pip install ansible-core ansible-lint yamllint shellcheck-py
      # Refreshed weekly, so new collection releases still get tested.
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache Ansible collections
        id: collections
        uses: actions/cache@v4
        with:
          path: ansible/.collections
          key: collections-lint-${{ steps.week.outputs.week }}-${{ hashFiles('ansible/requirements.yml') }}
      - if: steps.collections.outputs.cache-hit != 'true'
        run: make deps
      - run: make lint
      - name: Client auto-attach tests
        run: tests/client/test-autoattach.sh

  # Run the boot-partition script on every OS you might flash from,
  # against a fake bootfs folder, and check the result parses as YAML.
  configure-boot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make a fake bootfs and SSH key
        shell: bash
        run: |
          mkdir -p fakeboot keys
          touch fakeboot/config.txt fakeboot/cmdline.txt
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAItest ci@example" > keys/id.pub
          mkdir -p fakeboot2
          touch fakeboot2/config.txt fakeboot2/cmdline.txt
      - name: Run configure-boot.sh
        if: runner.os != 'Windows'
        run: |
          SSH_PUBKEY_FILE=keys/id.pub scripts/configure-boot.sh fakeboot
          PI_HOSTNAME=octopi SSH_PUBKEY_FILE=keys/id.pub scripts/configure-boot.sh fakeboot2
      - name: Run configure-boot.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          scripts\configure-boot.ps1 -Boot fakeboot -SshPubKeyFile keys\id.pub
          scripts\configure-boot.ps1 -Boot fakeboot2 -SshPubKeyFile keys\id.pub -Hostname octopi
      - name: Check output
        shell: bash
        run: |
          python3 -m pip install -q pyyaml
          python3 - <<'PY'
          import yaml
          for boot, host in [("fakeboot", "pilab"), ("fakeboot2", "octopi")]:
              raw = open(f"{boot}/user-data", "rb").read()
              assert not raw.startswith(b"\xef\xbb\xbf"), "BOM in user-data"
              assert b"\r\n" not in raw, "CRLF in user-data"
              assert raw.startswith(b"#cloud-config"), "missing #cloud-config header"
              d = yaml.safe_load(raw)
              assert d["hostname"] == host, d["hostname"]
              assert d["users"][0]["ssh_authorized_keys"][0].endswith("ci@example")
              assert yaml.safe_load(open(f"{boot}/network-config"))["network"]["version"] == 2
              assert open(f"{boot}/meta-data").read().strip() == f"instance-id: {host}"
          print("ok")
          PY
