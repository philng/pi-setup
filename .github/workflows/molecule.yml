---
# Run every role's Molecule scenario in an arm64 Debian trixie container with
# systemd: install, converge, a second run that must change nothing, verify.
name: molecule
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the run for the push before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      roles: ${{ steps.find.outputs.roles }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          roles=$(ls -d ansible/roles/*/molecule/default 2>/dev/null | cut -d/ -f3 | jq -Rnc '[inputs]')
          echo "roles=$roles" >> "$GITHUB_OUTPUT"

  molecule:
    needs: discover
    if: needs.discover.outputs.roles != '[]'
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(needs.discover.outputs.roles) }}
    runs-on: ubuntu-24.04-arm
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/molecule.yml
      - run: pip install ansible-core molecule "molecule-plugins[docker]" docker
      # Refreshed weekly, so new collection releases still get tested.
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache Ansible collections
        id: collections
        uses: actions/cache@v4
        with:
          path: |
            ansible/.collections
            ~/.ansible/collections
          key: collections-molecule-${{ steps.week.outputs.week }}-${{ hashFiles('ansible/requirements.yml') }}
      - name: Install Ansible collections
        if: steps.collections.outputs.cache-hit != 'true'
        run: |
          make deps
          ansible-galaxy collection install community.docker
      # Same image as `make molecule-image`, with layers cached between runs.
      - uses: docker/setup-buildx-action@v3
      - name: Build the Molecule test image
        uses: docker/build-push-action@v6
        with:
          context: molecule
          tags: pi-setup-molecule:trixie
          load: true
          cache-from: type=gha,scope=molecule-image
          cache-to: type=gha,scope=molecule-image,mode=max
      - name: molecule test
        working-directory: ansible/roles/${{ matrix.role }}
        run: molecule test
