---
# Run every role's Molecule scenario in an arm64 Debian trixie container with
# systemd: install, converge, a second run that must change nothing, verify.
name: molecule
# PRs only: the merge to main was already tested on its PR. Run it by hand
# (Actions > molecule > Run workflow) to test every role.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - docs/**
      - "**.md"
  workflow_dispatch:

# A new push to a PR cancels the run for the push before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      roles: ${{ steps.find.outputs.roles }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # PRs test only the roles they touch (shared files still test them all).
      # A manual run tests every role.
      - id: find
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          roles=$(.github/scripts/molecule-roles.sh ${BASE:+"$BASE"})
          echo "roles=$roles"
          echo "roles=$roles" >> "$GITHUB_OUTPUT"

  molecule:
    needs: discover
    if: needs.discover.outputs.roles != '[]'
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(needs.discover.outputs.roles) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Build the test image while Python and collections install.
      - name: Start building the Molecule test image
        run: (make molecule-image > "$RUNNER_TEMP/image.log" 2>&1; echo $? > "$RUNNER_TEMP/image.rc") &
      # The same tools as `make deps-dev` locally: Python and uv from mise.toml,
      # Python packages from requirements-dev.txt.
      - uses: jdx/mise-action@v3
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        with:
          version: 2026.11.10
          cache: true
      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('requirements*.txt') }}
      # Refreshed weekly, so new collection releases still get tested.
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache Ansible collections
        uses: actions/cache@v4
        with:
          path: ansible/.collections
          key: collections-v2-molecule-${{ steps.week.outputs.week }}-${{ hashFiles('ansible/requirements.yml') }}
      - run: make deps-dev
      - name: Wait for the test image
        run: |
          while [ ! -f "$RUNNER_TEMP/image.rc" ]; do sleep 1; done
          cat "$RUNNER_TEMP/image.log"
          exit "$(cat "$RUNNER_TEMP/image.rc")"
      # The runner is thrown away, so skip Molecule's destroy steps (~15s).
      - run: make molecule ROLE=${{ matrix.role }} MOLECULE_ARGS="--destroy=never"
