---
# Shared Molecule settings, loaded automatically for every scenario in this
# repo. Each role only needs roles/<role>/molecule/default/{molecule.yml,
# converge.yml,verify.yml}. Run one locally with: make molecule ROLE=<role>
dependency:
  name: galaxy
  enabled: false  # collections come from `make deps`
driver:
  name: docker
platforms:
  - name: pi
    image: pi-setup-molecule:trixie  # built from molecule/Dockerfile
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
provisioner:
  name: ansible
  env:
    # One `docker exec` per task instead of several (mkdir, copy the module,
    # run it, clean up): roughly halves the time each task takes.
    ANSIBLE_PIPELINING: "True"
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../../.collections:~/.ansible/collections
  config_options:
    defaults:
      interpreter_python: auto_silent
      callback_result_format: yaml
  options:
    # Tasks that need real Pi hardware (kernel modules, EEPROM, ...) carry
    # this tag and are covered by the smoke tests in docs/ instead.
    skip-tags: molecule-notest
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
